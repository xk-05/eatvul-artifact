name: artifact-check

on:
  push:
  pull_request:

jobs:
  artifact-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run artifact check
        run: python scripts/check_artifact.py
      - name: Run smoke check
        run: make smoke
